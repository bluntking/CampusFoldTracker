name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace > build.log 2>&1 || true
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 250 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if grep -q "BUILD SUCCESSFUL" build.log; then
            echo "Gradle build passed!"
          else
            echo "Gradle build failed!"
            grep -E "e: |Error: |FAILURE: |Exception" build.log | head -n 20 | while IFS= read -r line; do
              echo "::error title=Compiler Error::$line"
            done
            exit 1
          fi

      - name: Push Build Log to Debug Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug-log
          cp build.log ci_build.log
          git add ci_build.log
          git commit -m "ci: build log artifact" || true
          git push origin ci-debug-log --force || true

      - name: Prepare Versioned APK
        if: success()
        run: |
          VERSION="1.0.${{ github.run_number }}"
          mkdir -p release-apk
          for apk in app/build/outputs/apk/debug/*.apk; do
            cp "$apk" "release-apk/CampusFold-1.0.${{ github.run_number }}.apk"
          done

      - name: Upload Versioned APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CampusFold-1.0.${{ github.run_number }}
          path: release-apk/*.apk
          retention-days: 14

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace > test.log 2>&1 || true
          cat test.log | grep -E "FAILED|FAILURE|failure|Exception" || true
          if [ -d "app/build/test-results/testDebugUnitTest" ]; then
            cat app/build/test-results/testDebugUnitTest/*.xml | grep -B 2 -A 5 -E "failure|error" || true
          fi
          if grep -q "BUILD SUCCESSFUL" test.log; then
            echo "All unit tests passed!"
          else
            echo "Unit tests failed!"
            exit 1
          fi

      - name: Publish Direct APK to GitHub Releases (No ZIP)
        if: success() && (github.ref == 'refs/heads/main' || github.ref_name == 'main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK_FILE="release-apk/CampusFold-1.0.${{ github.run_number }}.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Publishing release $TAG with direct APK and changelog..."
            REPO="${{ github.repository }}"
            APK_URL="https://github.com/$REPO/releases/download/$TAG/CampusFold-1.0.${{ github.run_number }}.apk"

            git fetch --tags --force 2>/dev/null || true
            PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

            COMMITS=""
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)" --no-merges)
            else
              COMMITS=$(git log -n 15 --pretty=format:"- %s (%h)" --no-merges)
            fi

            CHANGELOG_SECTION=""
            if [ -f "CHANGELOG.md" ]; then
              CHANGELOG_SECTION=$(awk '
                /^## \[/ {
                  if (found) exit
                  found = 1
                  next
                }
                found { print }
              ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')
            fi

            echo "## 🚀 What's New in CampusFold v1.0.${{ github.run_number }}" > release_notes.md
            echo "" >> release_notes.md

            if [ -n "$CHANGELOG_SECTION" ]; then
              echo "$CHANGELOG_SECTION" >> release_notes.md
            else
              echo "$COMMITS" >> release_notes.md
            fi

            echo "" >> release_notes.md
            echo "---" >> release_notes.md
            echo "### 📱 Direct APK Download (No ZIP)" >> release_notes.md
            echo "Download directly to your Android device without unzipping:" >> release_notes.md
            echo "- [CampusFold-1.0.${{ github.run_number }}.apk]($APK_URL)" >> release_notes.md
            echo "- **In-Place Update:** Installs smoothly over your existing installation preserving all local databases and configurations." >> release_notes.md
            echo "" >> release_notes.md

            if [ -n "$CHANGELOG_SECTION" ] && [ -n "$COMMITS" ]; then
              echo "<details>" >> release_notes.md
              echo "<summary><b>Commits</b></summary>" >> release_notes.md
              echo "" >> release_notes.md
              echo "$COMMITS" >> release_notes.md
              echo "</details>" >> release_notes.md
            fi

            gh release create "$TAG" "$APK_FILE" \
              --title "CampusFold v1.0.${{ github.run_number }}" \
              --notes-file release_notes.md \
              --latest || gh release upload "$TAG" "$APK_FILE" --clobber || true

            echo "## 📱 Direct APK Download (No ZIP)" >> $GITHUB_STEP_SUMMARY
            echo "Download directly to your Android device without unzipping:" >> $GITHUB_STEP_SUMMARY
            echo "[Download CampusFold-1.0.${{ github.run_number }}.apk]($APK_URL)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Push Artifacts to Debug Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug-log
          [ -f build.log ] && cp build.log ci_build.log
          [ -f test.log ] && cp test.log ci_test.log
          mkdir -p ci_test_results
          [ -d app/build/test-results/testDebugUnitTest ] && cp -r app/build/test-results/testDebugUnitTest/* ci_test_results/ || true
          git add ci_build.log ci_test.log ci_test_results/ || true
          git commit -m "ci: debug artifacts" || true
          git push origin ci-debug-log --force || true

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
